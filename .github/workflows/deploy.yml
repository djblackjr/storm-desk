name: Refresh NHC data and deploy Storm Desk

on:
  push:
    branches: [main]
  schedule:
    # Off-peak minutes: GitHub delays or drops scheduled runs queued at busy times such as :00.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependency
        run: python -m pip install -r requirements.txt
      - name: Fetch public NHC products
        env:
          STORM_ID: ${{ vars.STORM_ID || 'AL092026' }}
          NHC_BIN: ${{ vars.NHC_BIN || 'AT4' }}
          DASHBOARD_JSON: dist/dashboard.json
          PREVIOUS_SNAPSHOT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard.json
        run: |
          mkdir -p dist
          cp index.html style.css app.js site.webmanifest app-icon.svg sw.js dist/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" dist/index.html dist/sw.js
          touch dist/.nojekyll
          python build_dashboard.py
      - name: Test public snapshot parsing and privacy shape
        run: python -m unittest -v test_build_dashboard.py
      - name: Check the published artifact
        run: |
          ! grep -l "__BUILD__" dist/index.html dist/sw.js
          python - <<'EOF'
          import json
          from test_build_dashboard import PUBLIC_KEYS
          snapshot = json.load(open("dist/dashboard.json"))
          extra = set(snapshot) - PUBLIC_KEYS
          assert not extra, f"unexpected keys in public snapshot: {extra}"
          layers = json.load(open("dist/layers.json"))
          print("snapshot keys ok;", "map layers:", ", ".join(sorted(layers)) or "none")
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
